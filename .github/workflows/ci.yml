name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # Distro Qt: 6.2.4 on 22.04 (the oldest Qt we support), 6.4.2 on 24.04.
    name: Build & Test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gettext libgtest-dev \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools libqt6webenginecore6-bin \
            libqt6opengl6-dev qt6-declarative-dev libvulkan-dev libgl1-mesa-dev \
            libssl-dev zlib1g-dev libx11-dev libxrandr-dev libxcb1-dev libxcb-keysyms1-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DOPENLOCK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error --parallel 4
